<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #container { width: 100%; height: 100%; }
    #status {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: #fff; padding: 10px 20px;
      border-radius: 8px; font-family: sans-serif; font-size: 15px; z-index: 999;
    }
  </style>
</head>
<body>
  <div id="status">Đang tải...</div>
  <div id="container"></div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { MindARThree } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js';

    // ---------- Tạo cánh sen ----------
    function createLotus() {
      const group = new THREE.Group();
      const pivots = [];

      const layers = [
        { count: 6,  radius: 0.08, color: 0xff1493, maxAngle: 1.50, delay: 0.00 },
        { count: 8,  radius: 0.14, color: 0xff69b4, maxAngle: 1.54, delay: 0.18 },
        { count: 10, radius: 0.21, color: 0xffb6c1, maxAngle: 1.57, delay: 0.36 },
      ];

      layers.forEach(layer => {
        for (let i = 0; i < layer.count; i++) {
          const angle = (i / layer.count) * Math.PI * 2;

          const shape = new THREE.Shape();
          shape.moveTo(0, 0);
          shape.bezierCurveTo( 0.055, 0.04,  0.075, 0.14, 0, 0.22);
          shape.bezierCurveTo(-0.075, 0.14, -0.055, 0.04, 0, 0);

          const geo = new THREE.ShapeGeometry(shape, 10);
          const mat = new THREE.MeshStandardMaterial({
            color: layer.color,
            side: THREE.DoubleSide,
            emissive: layer.color,
            emissiveIntensity: 0.2,
            transparent: true,
            opacity: 0,
          });

          const petal = new THREE.Mesh(geo, mat);

          const pivot = new THREE.Group();
          pivot.position.set(Math.sin(angle) * layer.radius, 0, Math.cos(angle) * layer.radius);
          pivot.rotation.y = -angle;
          pivot.rotation.x = 0;
          pivot.add(petal);
          group.add(pivot);

          pivots.push({ pivot, petal, maxAngle: layer.maxAngle, delay: layer.delay });
        }
      });

      // Đế sen màu vàng
      const baseGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.01, 32);
      const baseMat = new THREE.MeshStandardMaterial({
        color: 0xffdd44, emissive: 0xffaa00, emissiveIntensity: 0.4,
        transparent: true, opacity: 0,
      });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = -0.01;
      group.add(base);

      return { group, pivots, base };
    }

    // ---------- Tạo particles ----------
    function createParticles(count = 80) {
      const positions = new Float32Array(count * 3);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const mat = new THREE.PointsMaterial({
        color: 0xffee66, size: 0.013,
        transparent: true, opacity: 0,
      });

      const points = new THREE.Points(geo, mat);

      const data = Array.from({ length: count }, () => ({
        x: (Math.random() - 0.5) * 0.35,
        y: Math.random() * 0.3,
        z: (Math.random() - 0.5) * 0.35,
        vy: Math.random() * 0.006 + 0.003,
        vx: (Math.random() - 0.5) * 0.0015,
        vz: (Math.random() - 0.5) * 0.0015,
        life: Math.random(),
        maxLife: 0.8 + Math.random() * 0.8,
      }));

      return { points, data, positions, mat };
    }

    function updateParticles(p, bloom) {
      if (bloom < 0.4) { p.mat.opacity = 0; return; }
      p.mat.opacity = Math.min(0.9, (bloom - 0.4) * 3);

      p.data.forEach((d, i) => {
        d.life += 0.016;
        if (d.life > d.maxLife) {
          d.x = (Math.random() - 0.5) * 0.35;
          d.y = 0;
          d.z = (Math.random() - 0.5) * 0.35;
          d.vy = Math.random() * 0.006 + 0.003;
          d.vx = (Math.random() - 0.5) * 0.0015;
          d.vz = (Math.random() - 0.5) * 0.0015;
          d.life = 0;
        }
        d.x += d.vx; d.y += d.vy; d.z += d.vz;
        p.positions[i * 3]     = d.x;
        p.positions[i * 3 + 1] = d.y;
        p.positions[i * 3 + 2] = d.z;
      });

      p.points.geometry.attributes.position.needsUpdate = true;
    }

    // ---------- Main ----------
    const status = document.getElementById("status");

    const start = async () => {
      try {
        status.textContent = "Đang khởi động camera...";
        const mindarThree = new MindARThree({
          container: document.getElementById("container"),
          imageTargetSrc: "./targets.mind",
        });

        const { renderer, scene, camera } = mindarThree;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;

        // Ánh sáng
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfffbe6, 2.5);
        dirLight.position.set(4, 8, 6);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0x88aaff, 1.0);
        backLight.position.set(-4, 4, -4);
        scene.add(backLight);

        // Đèn point màu vàng xoay quanh
        const pointLight = new THREE.PointLight(0xffaa22, 2.5, 2.5);
        scene.add(pointLight);

        const anchor = mindarThree.addAnchor(0);

        // Sen + particles
        const lotus = createLotus();
        lotus.group.position.y = -0.13; // hạ xuống làm đế
        anchor.group.add(lotus.group);

        const particles = createParticles();
        anchor.group.add(particles.points);

        // Hào quang sau lưng phật
        const haloGeo = new THREE.RingGeometry(0.06, 0.11, 64);
        const haloMat = new THREE.MeshStandardMaterial({
          color: 0xffdd00,
          emissive: 0xffaa00,
          emissiveIntensity: 1.5,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0,
        });
        const halo = new THREE.Mesh(haloGeo, haloMat);
        halo.position.set(0, 0.14, -0.02); // sau lưng, ngang đầu phật
        anchor.group.add(halo);

        // Vầng sáng ngoài hào quang
        const glowGeo = new THREE.RingGeometry(0.11, 0.16, 64);
        const glowMat = new THREE.MeshStandardMaterial({
          color: 0xffee88,
          emissive: 0xffcc44,
          emissiveIntensity: 0.8,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.set(0, 0.14, -0.025);
        anchor.group.add(glow);

        // Model phật
        let model = null;
        status.textContent = "Đang tải model 3D...";
        const loader = new GLTFLoader();
        loader.setMeshoptDecoder(MeshoptDecoder);
        loader.load("./model_small.glb", (gltf) => {
          model = gltf.scene;
          model.scale.set(0.1, 0.1, 0.1);
          model.traverse(obj => {
            if (obj.isMesh) {
              obj.material = obj.material.clone();
              obj.material.transparent = true;
              obj.material.opacity = 0;
            }
          });
          anchor.group.add(model);
        }, undefined, (err) => {
          status.textContent = "Lỗi load model: " + err.message;
        });

        // Trạng thái hiệu ứng
        let bloom = 0;
        let active = false;

        anchor.onTargetFound = () => { active = true; };
        anchor.onTargetLost  = () => { active = false; bloom = 0; };

        await mindarThree.start();
        status.textContent = "Hướng camera vào ảnh target";
        setTimeout(() => status.style.display = "none", 3000);

        let t = 0;
        renderer.setAnimationLoop(() => {
          t += 0.02;

          // Tiến trình nở
          if (active && bloom < 1) bloom = Math.min(bloom + 0.012, 1);

          // Cánh sen nở
          lotus.pivots.forEach(({ pivot, petal, maxAngle, delay }) => {
            const p = Math.max(0, Math.min(1, (bloom - delay) / (1 - delay + 0.001)));
            const eased = 1 - Math.pow(1 - p, 3);
            pivot.rotation.x = maxAngle * eased;
            petal.material.opacity = eased;
          });

          // Đế sen
          lotus.base.material.opacity = Math.min(1, bloom * 3);

          // Phật + hào quang hiện dần sau khi sen nở 60%
          const mp = Math.max(0, Math.min(1, (bloom - 0.6) / 0.4));
          const eased = 1 - Math.pow(1 - mp, 2);

          if (model) {
            model.traverse(obj => {
              if (obj.isMesh) obj.material.opacity = eased;
            });
          }

          // Hào quang nhấp nháy
          const pulse = 0.85 + Math.sin(t * 2.5) * 0.15;
          haloMat.opacity = eased * pulse;
          glowMat.opacity = eased * pulse * 0.5;
          halo.rotation.z += 0.003; // xoay chậm

          // Particles vàng
          updateParticles(particles, bloom);

          // Đèn xoay
          pointLight.position.set(
            Math.sin(t) * 1.2,
            0.4 + Math.sin(t * 0.8) * 0.2,
            Math.cos(t) * 1.2
          );
          pointLight.intensity = (1.8 + Math.sin(t * 4) * 0.4) * Math.min(1, bloom * 2);

          renderer.render(scene, camera);
        });
      } catch(e) {
        status.textContent = "Lỗi: " + e.message;
      }
    };

    start();
  </script>
</body>
</html>
